<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rating Trend — EduRate</title>
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/modals.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <style>
    body { font-family: 'Syne', sans-serif; background: #0d0d1a; color: #dde1f0; }
    .trend-container { max-width: 900px; margin: 40px auto; padding: 20px; }
    .trend-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .trend-header h1 { margin: 0; font-size: 28px; font-weight: 700; }
    .back-btn { background: rgba(96, 165, 250, 0.1); border: 1px solid rgba(96, 165, 250, 0.3); 
               color: #60a5fa; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600;
               transition: all 0.2s; }
    .back-btn:hover { background: rgba(96, 165, 250, 0.2); border-color: rgba(96, 165, 250, 0.5); }
    
    .chart-wrapper { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
                     border-radius: 16px; padding: 30px; margin-bottom: 30px; }
    .chart-wrapper canvas { display: block; }
    
    .trend-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
    .stat-card { background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
                 border: 1px solid rgba(102, 126, 234, 0.3); border-radius: 12px; padding: 20px;
                 text-align: center; }
    .stat-label { font-size: 13px; color: #999; margin-bottom: 8px; text-transform: uppercase; }
    .stat-value { font-size: 28px; font-weight: 700; color: #c084fc; }
    
    .loading { text-align: center; padding: 40px; color: #999; }
    .error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3);
             color: #fca5a5; padding: 20px; border-radius: 8px; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="trend-container">
    <div class="trend-header">
      <h1>📈 Rating Trend Analysis</h1>
      <button class="back-btn" onclick="window.history.back()">← Back</button>
    </div>

    <div id="errorContainer"></div>
    <div id="loadingContainer" class="loading">Loading trend data...</div>
    
    <div id="trendContent" style="display: none;">
      <div class="chart-wrapper">
        <canvas id="trendChart"></canvas>
      </div>

      <div class="trend-stats">
        <div class="stat-card">
          <div class="stat-label">Average Rating</div>
          <div class="stat-value" id="avgRating">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Ratings</div>
          <div class="stat-value" id="totalRatings">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Highest Daily Avg</div>
          <div class="stat-value" id="highestAvg">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Trend</div>
          <div class="stat-value" id="trendDirection">—</div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/rating-trend.js"></script>
</body>
</html>
